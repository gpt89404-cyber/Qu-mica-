<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Químico Interactivo</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #18bc9c;
            --bg: #f8f9fa;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 10px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        .btn {
            background-color: var(--secondary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #128f76;
        }
    </style>
</head>
<body>
    <header>
        <h1>Simulador Químico y Estructuras 3D</h1>
        <p>Sistema interactivo de valencias, enlaces y unidades de estudio.</p>
    </header>
    <div class="container">
        <h2>Bienvenido</h2>
        <p>Selecciona una unidad de estudio para comenzar con los ejercicios y modelos interactivos:</p>
        <button class="btn" onclick="alert('Iniciando simulador...')">Comenzar Práctica</button>
    </div>
</body>
</html>
